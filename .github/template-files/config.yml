conda/governance:
  # [required] community files
  - CODE_OF_CONDUCT.md

conda/infrastructure:
  # [required] general workflows
  - .github/workflows/cla.yml
  - .github/workflows/update.yml

  # [optional] to include repo in https://github.com/orgs/conda/projects/2
  - .github/workflows/issues.yml
  - .github/workflows/labels.yml
  - .github/workflows/project.yml

  # [optional] stale bot workflows
  # - .github/workflows/stale.yml
  # - .github/workflows/lock.yml

  # [optional] canary build workflow
  - src: templates/workflows/build.yml
    dst: .github/workflows/build.yml
  # For noarch packages, add:
    with:
      noarch: true
      # conda-rattler-solver canaries are the only builds whose py-rattler
      # range is new enough for the current recipe pins, so the canary
      # channel supplies the dependency pin alongside conda-forge.
      conda_build_arguments: --override-channels -c conda-forge -c conda-canary/label/dev
  # For repos whose test workflow is not named "Tests", add:
  #   with:
  #     tests_workflow: Test

  # [optional] news fragment validation on PRs
  - src: templates/workflows/check-news.yml
    dst: .github/workflows/check-news.yml
  # For repos whose news directory is not "news", add:
  #   with:
  #     news_directory: releases/news

  # [optional] aggregate news fragments into CHANGELOG on release branches
  - src: templates/workflows/prepare-release.yml
    dst: .github/workflows/prepare-release.yml
  # For repos whose test workflow is not named "Tests", add:
  #   with:
  #     tests_workflow: Test
  # For repos whose news directory is not "news", add:
  #   with:
  #     news_directory: releases/news
  # For on-demand release projects without `.x` release branches, add:
    with:
      on_demand: true
  # which replaces the workflow_run automation with a workflow_dispatch
  # trigger for manual runs with a `version` input; cadence release projects
  # (the default) must rely on the workflow_run automation instead

  # [optional] push a connector branch and open a PR merging the release
  # branch back into main after a release is published
  # - src: templates/workflows/merge-back.yml
  #   dst: .github/workflows/merge-back.yml
  # For repos whose release process doc isn't at the repo root, add:
  #   with:
  #     release_process_path: releases/RELEASE.md

  # [optional] keep .authors.yml current (weekly PR)
  - src: templates/workflows/prepare-authors.yml
    dst: .github/workflows/prepare-authors.yml
  # For repos with a non-standard schedule, add:
  #   with:
  #     schedule: '0 4 * * 2'

  # [optional] general processes for the conda org
  - src: templates/HOW_WE_USE_GITHUB.md
    dst: HOW_WE_USE_GITHUB.md

  # [optional] standard issue templates
  - src: templates/issues/bug.yml
    dst: .github/ISSUE_TEMPLATE/0_bug.yml

  - src: templates/issues/feature.yml
    dst: .github/ISSUE_TEMPLATE/1_feature.yml

  - src: templates/issues/documentation.yml
    dst: .github/ISSUE_TEMPLATE/2_documentation.yml

  - src: templates/issues/epic.yml
    dst: .github/ISSUE_TEMPLATE/epic.yml

  # [optional] standard PR template
  - src: templates/pull_requests/news_tests_docs.md
    dst: .github/template-files/templates/pull_request_template_details.md
  - src: templates/pull_requests/base.md
    dst: .github/PULL_REQUEST_TEMPLATE.md

  # [optional] dependabot
  - src: templates/dependabot.yml
    dst: .github/dependabot.yml
    with:
      github_actions: true
      pre_commit: true
      docs: false

  # [optional] on-demand release process
  - src: templates/releases/RELEASE_ON_DEMAND.md
    dst: RELEASE.md
    with:
      placeholder: MAJOR.MINOR.PATCH
      tag_triggered_release: true
  - src: templates/releases/rever.xsh
    dst: rever.xsh
  - src: templates/releases/TEMPLATE
    dst: news/TEMPLATE
