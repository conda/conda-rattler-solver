name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout conda-rattler-solver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: conda-rattler-solver

      - name: Checkout conda test data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conda/conda
          ref: main
          persist-credentials: false
          path: conda

      - name: Record conda test data revision
        run: git -C conda rev-parse HEAD

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.70.1
          working-directory: conda-rattler-solver
          environments: test-py313
          locked: true

      - name: Run benchmarks
        working-directory: conda-rattler-solver
        run: >-
          pixi run --locked -e test-py313 benchmark
          --benchmark-json ../benchmark_results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: benchmark_results.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub pull request event
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-event
          path: ${{ github.event_path }}
          if-no-files-found: error
          retention-days: 7
