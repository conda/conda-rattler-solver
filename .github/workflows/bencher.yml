name: Track Benchmarks

on:
  workflow_run:
    workflows: [Benchmarks]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  track-benchmarks:
    if: >-
      !github.event.repository.fork
      && github.event.workflow_run.conclusion == 'success'
      && (
        github.event.workflow_run.event == 'pull_request'
        || (
          contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
          && github.event.workflow_run.head_branch == 'main'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      pull-requests: write
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/benchmark-results
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download PR event
        if: github.event.workflow_run.event == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-event
          path: ${{ runner.temp }}/benchmark-event
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Export PR event data
        if: github.event.workflow_run.event == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_EVENT: ${{ runner.temp }}/benchmark-event/event.json
        with:
          script: |
            const fs = require("fs")
            const prEvent = JSON.parse(fs.readFileSync(process.env.PR_EVENT, { encoding: "utf8" }))
            core.exportVariable("BRANCH", `pr-${prEvent.number}`)
            core.exportVariable("COMMIT_SHA", prEvent.pull_request.head.sha)
            core.exportVariable("PR_BASE", prEvent.pull_request.base.ref)
            core.exportVariable("PR_BASE_SHA", prEvent.pull_request.base.sha)
            core.exportVariable("PR_NUMBER", prEvent.number)

      - name: Install Bencher CLI
        uses: bencherdev/bencher@8d75325c3bc59403a2186a056b472c4f49d42838 # v0.6.12
        with:
          version: '0.6.12'

      - name: Track benchmarks with Bencher
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_RESULTS: ${{ runner.temp }}/benchmark-results/benchmark_results.json
        shell: bash
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            options=(
              --start-point "$PR_BASE"
              --start-point-hash "$PR_BASE_SHA"
              --start-point-clone-thresholds
              --start-point-reset
              --ci-only-thresholds
              --ci-only-on-alert
              --ci-number "$PR_NUMBER"
            )
          else
            options=(
              --threshold-measure latency
              --threshold-test t_test
              --threshold-max-sample-size 64
              --threshold-upper-boundary 0.99
              --thresholds-reset
            )
          fi
          bencher run \
            --project conda-rattler-solver \
            --key "$BENCHER_API_KEY" \
            --branch "$BRANCH" \
            --hash "$COMMIT_SHA" \
            --testbed ubuntu-22.04 \
            --err \
            --adapter python_pytest \
            --github-actions "$GH_TOKEN" \
            "${options[@]}" \
            --file "$BENCHMARK_RESULTS"
