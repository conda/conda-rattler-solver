name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.70.1
          run-install: false

      - name: Validate release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be a canonical bare version." >&2
            exit 1
          fi
          if ! grep -Fq "## ${RELEASE_TAG} (" CHANGELOG.md; then
            echo "No changelog entry found for ${RELEASE_TAG}." >&2
            exit 1
          fi

      - name: Build sdist and wheel from the lockfile
        run: pixi run --locked -e release build

      - name: Check distributions
        run: pixi run --locked -e release check-dist

      - name: Check distribution filenames
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(dist/*)
          wheel="dist/conda_rattler_solver-${RELEASE_TAG}-py3-none-any.whl"
          sdist="dist/conda_rattler_solver-${RELEASE_TAG}.tar.gz"
          if [[ "${#files[@]}" -ne 2 || ! -f "$wheel" || ! -f "$sdist" ]]; then
            echo "Expected only ${wheel} and ${sdist}." >&2
            printf 'Found %s\n' "${files[@]}" >&2
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  attest:
    name: Attest distributions
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*

  draft-release:
    name: Prepare draft GitHub Release
    runs-on: ubuntu-latest
    needs: [attest]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Attach distributions to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null) || draft=""
          if [[ "$draft" == "false" ]]; then
            echo "Release ${RELEASE_TAG} is already published." >&2
            exit 1
          elif [[ "$draft" != "true" ]]; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi

          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for artifact in dist/*; do
            name=${artifact##*/}
            if grep -Fxq "$name" <<< "$assets"; then
              gh release download "$RELEASE_TAG" --pattern "$name" --output - | cmp "$artifact" -
            else
              gh release upload "$RELEASE_TAG" "$artifact"
            fi
          done

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [draft-release]
    environment:
      name: pypi
      url: https://pypi.org/p/conda-rattler-solver
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
