schema_version: 1

context:
  git_repo_url: ../
  # VERSION_OVERRIDE is used by the canary release workflow
  base_version: ${{ env.get("VERSION_OVERRIDE", default=git.latest_tag(git_repo_url)) }}
  version: ${{ base_version }}.${{ git.latest_tag_distance(git_repo_url) }}+${{ (git.head_rev(git_repo_url))[:8] }}

package:
  name: conda-rattler-solver
  version: ${{ version }}

source:
  # git_url is nice in that it won't capture devenv stuff.  However, it only
  # captures committed code, so pay attention.
  git: ../
  target_directory: src/

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install src/ -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.11.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=3.11
    - conda >=26.7.0
    - py-rattler >=0.26.0,<0.27.0a0

tests:
  - python:
      imports:
        - conda_rattler_solver
      pip_check: false
      python_version: 3.11.*
  - requirements:
      run:
        - python 3.11.*
        - conda >=26.7.0
    script:
      - conda create --dry-run --solver=rattler -c conda-forge scipy
      - >-
        python -c
        "import conda_rattler_solver as crs;
        from importlib.metadata import version;
        assert '${{ version }}' == crs.__version__ == version('conda_rattler_solver'),
        '${{ version }}' + f', {crs.__version__}, ' + version('conda_rattler_solver')
        " || true

about:
  license: BSD-3-Clause
  license_file: src/LICENSE
  summary: The fast pixi solver, now in conda!
  homepage: https://github.com/conda-incubator/conda-rattler-solver

extra:
  recipe-maintainers:
    - jaimergp
